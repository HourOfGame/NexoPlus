name: Build NexoPlus JAR
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B --no-transfer-progress

      - name: Show errors if failed
        if: failure()
        run: mvn clean package 2>&1 | tail -100

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: NexoPlus-JAR
          path: target/NexoPlus-*.jar
          retention-days: 30
